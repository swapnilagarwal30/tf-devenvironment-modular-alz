name: Terraform Azure CI-CD

on:

  # ==========================================================
  # FEATURE BRANCH PUSH
  # ==========================================================
  push:
    branches:
      - "**"
      - "!main"

  # ==========================================================
  # PULL REQUEST TO MAIN
  # ==========================================================
  pull_request:
    branches:
      - main

  # ==========================================================
  # MANUAL RUN
  # ==========================================================
  workflow_dispatch:


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================
env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "parent_module/dev"


# ==========================================================
# GITHUB PERMISSIONS
# ==========================================================
permissions:
  contents: read


jobs:

  # ==========================================================
  # TERRAFORM PLAN
  # Runs on feature branches and PRs
  # ==========================================================
  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    # Do not run this job on main
    if: github.ref != 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT CODE
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. AZURE LOGIN
      # SERVICE PRINCIPAL + CLIENT SECRET
      # NO OIDC
      # ------------------------------------------------------
      - name: Azure Login
        shell: bash
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"


      # ------------------------------------------------------
      # 3. VERIFY AZURE LOGIN
      # ------------------------------------------------------
      - name: Verify Azure Login
        run: |
          echo "Azure Login Successful!"
          az account show


      # ------------------------------------------------------
      # 4. SETUP TERRAFORM
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # 5. TERRAFORM FORMAT CHECK
      # ------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. TERRAFORM INIT
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------------
      # 8. TERRAFORM PLAN
      # ------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ==========================================================
  # TERRAFORM APPLY
  # Runs ONLY on main branch
  # ==========================================================
  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    # Only main branch
    if: github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT CODE
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. AZURE LOGIN
      # SERVICE PRINCIPAL + CLIENT SECRET
      # NO OIDC
      # ------------------------------------------------------
      - name: Azure Login
        shell: bash
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"


      # ------------------------------------------------------
      # 3. VERIFY AZURE LOGIN
      # ------------------------------------------------------
      - name: Verify Azure Login
        run: |
          echo "Azure Login Successful!"
          az account show


      # ------------------------------------------------------
      # 4. SETUP TERRAFORM
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # 5. TERRAFORM FORMAT CHECK
      # ------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. TERRAFORM INIT
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------------
      # 8. TERRAFORM PLAN
      # ------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


      # ------------------------------------------------------
      # 9. TERRAFORM APPLY
      # ------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve