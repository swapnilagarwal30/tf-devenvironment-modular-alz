name: Terraform Azure CI-CD

on:

  # Feature branches
  push:
    branches:
      - "**"
      - "!main"

  # Pull Request to main
  pull_request:
    branches:
      - main

  # Manual execution
  workflow_dispatch:


env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: "parent_module/dev"


permissions:
  contents: read


jobs:

  # ==========================================================
  # TERRAFORM PLAN
  # Feature Branch / Pull Request
  # ==========================================================
  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    if: github.ref != 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Azure Login
      # Service Principal + Client Secret
      # NO OIDC
      # ------------------------------------------------------
      - name: Azure Login
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |
          set -e

          echo "Logging into Azure using Service Principal..."

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none

          az account set \
            --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Azure login successful."


      # ------------------------------------------------------
      # 3. Verify Azure Account
      # ------------------------------------------------------
      - name: Verify Azure Login
        run: |
          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table


      # ------------------------------------------------------
      # 4. Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # 5. Terraform Format
      # ------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------------
      # 7. Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------------
      # 8. Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ==========================================================
  # TERRAFORM APPLY
  # MAIN BRANCH ONLY
  # ==========================================================
  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Azure Login
      # Service Principal + Client Secret
      # NO OIDC
      # ------------------------------------------------------
      - name: Azure Login
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        run: |
          set -e

          echo "Logging into Azure using Service Principal..."

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none

          az account set \
            --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Azure login successful."


      # ------------------------------------------------------
      # 3. Verify Azure Account
      # ------------------------------------------------------
      - name: Verify Azure Login
        run: |
          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table


      # ------------------------------------------------------
      # 4. Setup Terraform
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # 5. Terraform Format
      # ------------------------------------------------------
      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # ------------------------------------------------------
      # 6. Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------------
      # 7. Terraform Validate
      # ------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------------
      # 8. Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


      # ------------------------------------------------------
      # 9. Terraform Apply
      # ------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve